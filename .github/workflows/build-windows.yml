name: Build GigaScribe for Windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'windows/build-windows.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build EXE + setup + portable ZIP
        shell: pwsh
        run: .\windows\build-windows.ps1
      - name: Upload setup and portable distribution
        uses: actions/upload-artifact@v4
        with:
          name: GigaScribe-Windows
          path: releases/*
          if-no-files-found: error
          retention-days: 14
