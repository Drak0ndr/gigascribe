name: Build GigaScribe for Windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Check Python syntax before installing heavy dependencies
        shell: pwsh
        run: |
          python -m compileall -q backend desktop.py tests
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
      - name: Build React + Mantine frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Mantine frontend build failed' }
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'windows/build-windows.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer and portable distribution
        shell: pwsh
        run: .\windows\build-windows.ps1
      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: GigaScribe-Windows-Installer
          path: releases/GigaScribe-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Validate portable folder
        shell: pwsh
        run: |
          if (!(Test-Path 'portable/GigaScribe/GigaScribe.exe')) { throw 'Portable EXE missing' }
          if (!(Test-Path 'portable/GigaScribe/.portable')) { throw 'Portable mode marker missing' }
          if (!(Test-Path 'portable/GigaScribe/_internal')) { throw 'Portable libraries missing' }
          if (Test-Path 'releases/GigaScribe-Windows-Portable.zip') { throw 'Unexpected nested portable ZIP' }
      - name: Upload portable folder (GitHub makes a single ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: GigaScribe-Windows-Portable
          path: portable/GigaScribe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
